      }
    }

    function updateApiPill() {
      const pill = $('#apiPill'), txt = $('#apiPillTxt');
      if (!pill) return;
      const dot = pill.querySelector('.dot');
      const online = State.apiOnline && !State.settings.demoMode;
      dot.className = 'dot' + (online ? '' : ' off');
      txt.textContent = online ? 'API EN LIGNE' : (State.settings.demoMode ? 'MODE DÉMO' : 'API HORS LIGNE');
    }

    function refresh() {
      render();
      if (State.ui.selectedId && $('#modalRoot').children.length) renderModal();
      renderNotifPanel();
      updateBadge();
    }

    function navigate(section) {
      State.ui.section = section;
      render();
      $('#content').scrollTop = 0;
      closeSidebar();
      if (window.innerWidth <= 900) closeNotifPanel();
    }

    /* ============================================================
       13. MODAL
       ============================================================ */
    function renderModal() {
      const r = RequestManager.get(State.ui.selectedId);
      const root = $('#modalRoot');
      if (!r) { root.innerHTML = ''; return; }

      const idx = statusIndex(r.status);
      const timeline = STATUSES.map((s, i) =>
        '<div class="tl-step ' + (i < idx ? 'done' : i === idx ? 'cur' : '') + '">' + s.label + '</div>').join('');

      const canAccept = r.status === 'received' || r.status === 'new';
      const canStart = r.status === 'accepted';
      const canSubmit = r.status === 'in_progress';
      const canResolve = r.status === 'submitted';
      const canVerify = r.status === 'resolved';
      const canClose = r.status === 'verified';

      const checklistHtml = r.checklist.map((c, i) =>
        '<div class="check-item ' + (c.done ? 'done' : '') + '" data-action="toggle-step" data-id="' + r.id + '" data-step="' + i + '">' +
        '<div class="check-box">' + (c.done ? '✓' : '') + '</div>' +
        '<span>' + esc(c.text) + '</span>' +
        '</div>').join('');

      const workspaceVisible = idx >= statusIndex('accepted');

      root.innerHTML =
        '<div class="modal-bg" data-action="close-modal-bg">' +
        '<div class="modal">' +
        '<div class="m-head">' +
        '<div style="flex:1;min-width:0">' +
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
        '<span class="req-id" style="font-size:12px">' + r.id + '</span>' +
        sectorPill(r.sector) + diffPill(r.difficulty) + prioBadge(r.priority) +
        (r.simulated ? '<span class="sim-badge">SIMULÉ</span>' : '') +
        '</div>' +
        '<h2>' + esc(r.title) + '</h2>' +
        '</div>' +
        '<button class="icon-btn" data-action="close-modal">✕</button>' +
        '</div>' +
        '<div class="m-body">' +
        '<div class="meta-grid">' +
        '<div><label>Statut</label><b>' + statusLabel(r.status) + '</b></div>' +
        '<div><label>Localisation</label><b>' + esc(r.location) + '</b></div>' +
        '<div><label>Citoyen</label><b>' + esc(r.citizen) + '</b></div>' +
        '<div><label>XP de base</label><b>' + fmtNum(r.baseXP) + ' XP</b></div>' +
        '<div><label>Bonus tardif</label><b style="color:var(--amber)">+' + fmtNum(r.lateBonus) + ' XP</b></div>' +
        '<div><label>Total</label><b style="color:var(--green)">' + fmtNum(r.totalXP) + ' XP</b></div>' +
        '<div><label>Créée le</label><b>' + fmtDT(r.createdAt) + '</b></div>' +
        '<div><label>Mise à jour</label><b>' + fmtDT(r.updatedAt) + '</b></div>' +
        '<div><label>Vague</label><b>#' + (r.wave || 1) + '</b></div>' +
        '</div>' +
        '<h3 style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px">Description</h3>' +
        '<p style="margin:0;line-height:1.7;color:#b9cbdd;font-size:13.2px">' + esc(r.description) + '</p>' +
        '<h3 style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:22px 0 0">Cycle de vie</h3>' +
        '<div class="timeline">' + timeline + '</div>' +
        (workspaceVisible
          ? '<h3 style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:22px 0 4px">Espace de résolution — checklist</h3>' +
          '<div>' + checklistHtml + '</div>' +
          '<h3 style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px">Solution</h3>' +
          '<textarea id="solutionInput" placeholder="Décrivez la solution appliquée…" ' +
          (idx >= statusIndex('submitted') ? 'readonly' : '') + '>' + esc(r.solution) + '</textarea>'
          : '') +
        '</div>' +
        '<div class="m-foot">' +
        (canAccept ? '<button class="btn primary" data-action="accept" data-id="' + r.id + '">✓ Accepter la demande</button>' : '') +
        (canStart ? '<button class="btn primary" data-action="start" data-id="' + r.id + '">▶ Démarrer le traitement</button>' : '') +
        (canSubmit ? '<button class="btn primary" data-action="submit" data-id="' + r.id + '">⇧ Soumettre la solution</button>' : '') +
        (canResolve ? '<button class="btn primary" data-action="resolve" data-id="' + r.id + '">★ Marquer résolue (+' + fmtNum(r.totalXP) + ' XP)</button>' : '') +
        (canVerify ? '<button class="btn" data-action="verify" data-id="' + r.id + '">✓ Vérifier</button>' : '') +
        (canClose ? '<button class="btn ghost" data-action="close-req" data-id="' + r.id + '">Clôturer</button>' : '') +
        '<span style="flex:1"></span>' +
        '<button class="btn ghost" data-action="close-modal">Fermer</button>' +
        '</div>' +
        '</div>' +
        '</div>';
    }

    function openRequest(id) {
      State.ui.selectedId = id;
      renderModal();
    }
    function closeModal() {
      State.ui.selectedId = null;
      $('#modalRoot').innerHTML = '';
    }

    /* ============================================================
       14. EMERGENCY
       ============================================================ */
    function openEmergency() {
      const crit = RequestManager.critical();
      const r = crit[0];
      const root = $('#emergencyRoot');
      if (!r) { toast('info', 'Aucune urgence', 'Aucun incident critique actif actuellement.'); return; }
      root.innerHTML =
        '<div class="emergency">' +
        '<div class="em-box">' +
        '<div style="font-size:42px">⚠</div>' +
        '<h2>MODE URGENCE</h2>' +
        '<p><b>' + r.id + '</b> — ' + esc(r.title) + '<br>' +
        esc(r.location) + ' · ' + SECTORS[r.sector].label + '</p>' +
        '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
        '<button class="btn danger" data-action="emergency-respond" data-id="' + r.id + '">Répondre immédiatement</button>' +
        '<button class="btn ghost" data-action="close-emergency">Fermer</button>' +
        '</div>' +
        '</div>' +
        '</div>';
    }
    function closeEmergency() { $('#emergencyRoot').innerHTML = ''; }

    /* ============================================================
       15. SIMULATION
       ============================================================ */
    let wave = 1;
    function simulateRequest(notify) {
      wave++;
      const r = buildRequest({ wave, simulated: true });
      RequestManager.add(r, { notify: notify !== false });
      if (['command', 'requests', 'operations', 'map', 'alerts', 'analytics'].includes(State.ui.section)) {
        render();
      }
      return r;
    }

    function startSimulation() {
      stopSimulation();
      if (!State.settings.autoSim) return;
      State.ui.simTimer = setInterval(() => {
        if (State.ui.demoRunning) return;
        simulateRequest(true);
      }, Math.max(4000, State.settings.simInterval));
    }
    function stopSimulation() {
      if (State.ui.simTimer) { clearInterval(State.ui.simTimer); State.ui.simTimer = null; }
    }

    /* ---------- JURY DEMO ---------- */
    async function startJuryDemo() {
      if (State.ui.demoRunning) return;
      State.ui.demoRunning = true;

      const banner = document.createElement('div');
      banner.id = 'demoBanner';
      banner.style.cssText = 'position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:500;' +
        'background:rgba(13,20,36,.96);border:1px solid rgba(53,230,255,.45);border-radius:12px;padding:11px 18px;' +
        'display:flex;align-items:center;gap:14px;backdrop-filter:blur(16px);box-shadow:0 20px 50px rgba(0,0,0,.6);font-size:12.5px';
      banner.innerHTML = '<span style="width:8px;height:8px;border-radius:50%;background:#ff2e8b;display:block;animation:pulse 1s infinite"></span>' +
        '<span id="demoStep">Démonstration en cours…</span>' +
        '<button class="btn ghost sm" data-action="stop-demo">Arrêter</button>';
      document.body.appendChild(banner);

      const setStep = t => { const e = $('#demoStep'); if (e) e.textContent = t; };
      const guard = () => { if (!State.ui.demoRunning) throw 'stopped'; };

      try {
        setStep('1/10 — Ouverture du Command Center');
        navigate('command'); await sleep(1500); guard();

        setStep('2/10 — Réception d\'une nouvelle demande');
        const r = simulateRequest(true);
        await sleep(1500); guard();

        setStep('3/10 — Notification détectée par ZENITH');
        openNotifPanel();
        await sleep(1500); guard();
        closeNotifPanel();

        setStep('4/10 — Ouverture du détail de la demande');
        openRequest(r.id);
        await sleep(2000); guard();

        setStep('5/10 — Acceptation de la demande');
        RequestManager.setStatus(r.id, 'accepted');
        r.checklist[0].done = true;
        renderModal(); await sleep(1500); guard();

        setStep('6/10 — Démarrage et résolution');
        RequestManager.setStatus(r.id, 'in_progress');
        r.checklist.forEach(c => c.done = true);
        renderModal(); await sleep(1400); guard();

        r.solution = 'Intervention réalisée par l\'équipe ZENITH. Situation rétablie et citoyen informé.';
        RequestManager.setStatus(r.id, 'submitted');
        renderModal(); await sleep(1200); guard();

        RequestManager.setStatus(r.id, 'resolved');
        renderModal(); await sleep(1700); guard();

        setStep('7/10 — Mise à jour des XP');
        closeModal();
        navigate('command'); await sleep(1400); guard();

        setStep('8/10 — Carte & planète 3D');
        navigate('map'); await sleep(1500); guard();
        State.ui.mapMode = 'planet'; render();
        await sleep(4200); guard();

        setStep('9/10 — Mise à jour de l\'analytique');
        navigate('analytics'); await sleep(1800); guard();

        setStep('10/10 — Vue Haut Conseil');
        navigate('council'); await sleep(1600); guard();

        setStep('Démonstration terminée ✓');
        await sleep(1400);
      } catch (e) {}

      State.ui.demoRunning = false;
      const b = $('#demoBanner'); if (b) b.remove();
      refresh();
    }
    function stopJuryDemo() {
      State.ui.demoRunning = false;
      const b = $('#demoBanner'); if (b) b.remove();
    }

    /* ============================================================
       16. SEARCH
       ============================================================ */
    function handleSearch(q) {
      const box = $('#searchResults');
      if (!q.trim()) { box.classList.remove('open'); box.innerHTML = ''; return; }
      const results = RequestManager.search(q);
      if (!results.length) {
        box.innerHTML = '<div class="sr-empty">Aucun résultat pour « ' + esc(q) + ' »</div>';
      } else {
        box.innerHTML = results.map(r =>
          '<div class="sr-item" data-action="open-request" data-id="' + r.id + '">' +
          '<span style="width:7px;height:7px;border-radius:50%;background:' + SECTORS[r.sector].color + ';display:block;box-shadow:0 0 8px ' + SECTORS[r.sector].color + '"></span>' +
          '<div style="min-width:0;flex:1">' +
          '<div style="font-size:12.8px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(r.title) + '</div>' +
          '<div style="font-size:11px;color:var(--muted)">' + r.id + ' · ' + SECTORS[r.sector].label + ' · ' + statusLabel(r.status) + '</div>' +
          '</div>' +
          '</div>').join('');
      }
      box.classList.add('open');
    }
    function closeSearch() { $('#searchResults').classList.remove('open'); }

    /* ============================================================
       17. SIDEBAR / NOTIF
       ============================================================ */
    function openSidebar() { $('#sidebar').classList.add('open'); $('#scrim').classList.add('show'); }
    function closeSidebar() { $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('show'); }
    function toggleSidebar() { $('#sidebar').classList.contains('open') ? closeSidebar() : openSidebar(); }
    function openNotifPanel() { $('#notifPanel').classList.add('open'); }
    function closeNotifPanel() { $('#notifPanel').classList.remove('open'); }
    function toggleNotifPanel() { $('#notifPanel').classList.toggle('open'); }

    /* ============================================================
       18. GLOBAL EVENTS
       ============================================================ */
    document.addEventListener('click', async (e) => {
      const target = e.target.closest('[data-action]');

      if (!e.target.closest('#notifPanel') && !e.target.closest('#notifBtn')) closeNotifPanel();
      if (!e.target.closest('.search')) closeSearch();

      if (!target) return;
      const action = target.dataset.action;
      const id = target.dataset.id;

      switch (action) {
        case 'nav': navigate(target.dataset.section); break;
        case 'goto-sector': State.ui.filters.sector = target.dataset.sector; navigate('requests'); break;
        case 'filter-sector': State.ui.filters.sector = target.dataset.value; render(); break;
        case 'filter-sector-map':
          State.ui.filters.sector = target.dataset.value;
          State.ui.filters.status = 'all';
          navigate('requests');
          break;
        case 'reset-filters':
          State.ui.filters = { sector: 'all', status: 'all', difficulty: 'all', priority: 'all' };
          render();
          break;

        case 'map-mode':
          State.ui.mapMode = target.dataset.value;
          if (State.ui.mapMode !== 'planet') destroyPlanet3D();
          render();
          break;

        case 'open-request': {
          openRequest(id);
          const si = $('#globalSearch');
          if (si) si.value = '';
          closeSearch();
          break;
        }
        case 'close-modal': closeModal(); break;
        case 'close-modal-bg':
          // Only close if the click was directly on the background, not inside the modal content
          if (e.target.classList.contains('modal-bg')) closeModal();
          break;

        case 'accept':
          RequestManager.setStatus(id, 'accepted');
          renderModal(); refresh();
          toast('new', 'Demande acceptée', id + ' est désormais prise en charge.');
          break;
        case 'start':
          RequestManager.setStatus(id, 'in_progress');
          renderModal(); refresh();
          break;
        case 'submit': {
          const ta = $('#solutionInput');
          const txt = ta ? ta.value.trim() : '';
          if (!txt) { toast('info', 'Solution requise', 'Décrivez la solution avant de la soumettre.'); break; }
          const r = RequestManager.get(id);
          r.solution = txt;
          RequestManager.setStatus(id, 'submitted');
          renderModal(); refresh();
          toast('resolved', 'Solution soumise', id + ' attend une validation.');
          break;
        }
        case 'resolve':
          RequestManager.setStatus(id, 'resolved');
          renderModal(); refresh();
          break;
        case 'verify':
          RequestManager.setStatus(id, 'verified');
          renderModal(); refresh();
          break;
        case 'close-req':
          RequestManager.setStatus(id, 'closed');
          renderModal(); refresh();
          break;
        case 'toggle-step': {
          const r = RequestManager.get(id);
          const i = parseInt(target.dataset.step, 10);
          if (r && r.checklist[i]) {
            r.checklist[i].done = !r.checklist[i].done;
            r.updatedAt = Date.now();
            persist(); renderModal();
          }
          break;
        }

        case 'notif-click': {
          const n = State.notifications.find(x => x.id === id);
          if (n) {
            Notifications.markRead(id);
            if (n.requestId) openRequest(n.requestId);
          }
          closeNotifPanel();
          break;
        }
        case 'mark-all-read': Notifications.markAllRead(); break;

        case 'emergency-mode': openEmergency(); break;
        case 'emergency-respond': closeEmergency(); openRequest(id); break;
        case 'close-emergency': closeEmergency(); break;

        case 'start-jury-demo': startJuryDemo(); break;
        case 'stop-demo': stopJuryDemo(); break;

        case 'test-api': {
          toast('info', 'Test de connexion', 'Vérification de l\'endpoint en cours…');
          const res = await APIManager.test();
          if (res.ok) {
            toast('resolved', 'Connexion réussie', res.message);
            State.settings.demoMode = false;
          } else {
            toast('critical', 'Connexion échouée', res.message);
            State.settings.demoMode = true;
          }
          persist(); render();
          break;
        }
        case 'reset-data':
          if (confirm('Réinitialiser toutes les données locales ?')) {
            Storage.clear();
            State.requests = [];
            State.notifications = [];
            State.xp = 0;
            State.seq = 1;
            State.sessionStart = Date.now();
            wave = 1;
            seedDemoData();
            persist();
            toast('info', 'Données réinitialisées', 'Un nouveau jeu de démonstration a été généré.');
            refresh();
          }
          break;
        case 'simulate-request':
          simulateRequest(true);
          toast('new', 'Demande simulée générée', 'Une nouvelle demande de démonstration a été injectée.');
          break;

        case 'search-citizen': {
          const input = $('#globalSearch');
          if (input) { input.value = id; handleSearch(id); }
          break;
        }
      }
    });

    document.addEventListener('change', (e) => {
      const f = e.target.dataset.filter;
      if (f) { State.ui.filters[f] = e.target.value; render(); return; }
      const key = e.target.dataset.setting;
      if (key) {
        let v = e.target.value;
        if (key === 'simInterval') v = clamp(parseInt(v, 10) || 15000, 3000, 300000);
        if (key === 'autoSim') v = v === 'true';
        State.settings[key] = v;
        persist();
        if (key === 'autoSim' || key === 'simInterval') startSimulation();
      }
    });

    document.addEventListener('input', (e) => {
      if (e.target.id === 'globalSearch') { handleSearch(e.target.value); return; }
      const key = e.target.dataset.setting;
      if (key === 'apiUrl' || key === 'apiKey') {
        State.settings[key] = e.target.value;
        persist();
      }
    });

    $('#notifBtn').addEventListener('click', (e) => { e.stopPropagation(); toggleNotifPanel(); });
    $('#emgBtn').addEventListener('click', openEmergency);
    $('#menuBtn').addEventListener('click', toggleSidebar);
    $('#scrim').addEventListener('click', closeSidebar);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if ($('#emergencyRoot').children.length) { closeEmergency(); return; }
        if ($('#modalRoot').children.length) { closeModal(); return; }
        closeNotifPanel(); closeSearch(); closeSidebar();
      }
      if (e.key === '/' && document.activeElement.id !== 'globalSearch') {
        e.preventDefault();
        $('#globalSearch').focus();
      }
    });

    function tickClock() {
      const el = $('#clock');
      if (el) el.textContent = new Date().toLocaleTimeString('fr-FR');
    }
    setInterval(tickClock, 1000);

    /* ============================================================
       19. BOOT
       ============================================================ */
    const BOOT_LINES = [
      { t: '> ZENITH KERNEL v2.6 — initialisation…', d: 180 },
      { t: '> Chargement de la configuration locale… <span class="ok">OK</span>', d: 260 },
      { t: '> Vérification de l\'état de l\'application… <span class="ok">OK</span>', d: 260 },
      { t: '> Chargement du moteur 3D (Three.js)… <span class="ok">OK</span>', d: 280 },
      { t: '> Recherche de l\'API Terra Nova…', d: 340 },
      { t: '> <span class="warn">API indisponible — bascule en MODE DÉMO / SIMULATION</span>', d: 320, cond: () => !State.apiOnline },
      { t: '> <span class="ok">API en ligne — synchronisation établie</span>', d: 320, cond: () => State.apiOnline },
      { t: '> Démarrage des services urbains… <span class="ok">OK</span>', d: 240 },
      { t: '> Connexion au Haut Conseil de Terra Nova… <span class="ok">ÉTABLIE</span>', d: 280 },
      { t: '> Chargement des demandes citoyennes… <span class="ok">' + State.requests.length + ' entrées</span>', d: 260 },
      { t: '> <span class="ok">ZENITH EN LIGNE.</span>', d: 420 }
    ];

    async function runBoot() {
      const log = $('#bootLog');
      const bar = $('#bootBar');
      const boot = $('#boot');
      let cancelled = false;

      const skip = () => { cancelled = true; boot.classList.add('done'); $('#app').classList.remove('hidden'); };
      boot.addEventListener('click', skip, { once: true });

      for (let i = 0; i < BOOT_LINES.length; i++) {
        if (cancelled) return;
        const line = BOOT_LINES[i];
        if (line.cond && !line.cond()) continue;
        const div = document.createElement('div');
        div.innerHTML = line.t;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
        bar.style.width = Math.round(((i + 1) / BOOT_LINES.length) * 100) + '%';
        await sleep(line.d);
      }
      if (cancelled) return;
      await sleep(420);
      boot.classList.add('done');
      setTimeout(() => { $('#app').classList.remove('hidden'); }, 260);
    }

    /* ============================================================
       20. INIT
       ============================================================ */
    async function init() {
      const hadData = Storage.load();

      if (!hadData || !State.requests.length) {
        State.sessionStart = Date.now();
        seedDemoData();
        Notifications.add('info', 'ZENITH initialisé',
          'Plateforme de commandement Terra Nova opérationnelle. Mode démo actif.');
        persist();
      }

      if (APIManager.configured()) {
        await APIManager.test();
        if (State.apiOnline) {
          const news = await APIManager.fetchNew();
          news.forEach(r => RequestManager.add(r, { notify: true }));
          State.settings.demoMode = false;
        }
      }
      if (!State.apiOnline) State.settings.demoMode = true;

      renderNotifPanel();
      updateBadge();
      tickClock();
      render();

      await runBoot();
      startSimulation();

      setInterval(() => {
        if (document.hidden) return;
        if (State.ui.section === 'command' || State.ui.section === 'requests') render();
      }, 60000);

      console.log('%c ZENITH ', 'background:#35e6ff;color:#02121a;font-weight:700;padding:2px 6px;border-radius:4px', 'Terra Nova Command Center — prêt.');
    }

    document.addEventListener('DOMContentLoaded', init);

    window.ZENITH = {
      state: State,
      openRequest, navigate, simulateRequest, startJuryDemo,
      RequestManager, XPEngine, initPlanet3D, destroyPlanet3D
    };

  })();
</script>
</body>
</html>
