<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ZENITH — Terra Nova Command Center</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    /* ============================================================
       ZENITH — TERRA NOVA COMMAND CENTER
       ============================================================ */
    :root {
      --bg: #04070f;
      --panel: rgba(13, 20, 36, .72);
      --panel-2: rgba(18, 27, 48, .9);
      --line: rgba(80, 140, 200, .18);
      --line-2: rgba(80, 140, 200, .38);
      --txt: #dbe7f5;
      --muted: #7f93ad;
      --cyan: #35e6ff;
      --blue: #3b7bff;
      --magenta: #ff2e8b;
      --green: #29e08a;
      --amber: #ffb020;
      --r: 14px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--txt);
      overflow: hidden;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(1200px 700px at 78% -12%, rgba(59, 123, 255, .20), transparent 62%),
        radial-gradient(900px 620px at 4% 112%, rgba(255, 46, 139, .14), transparent 62%),
        radial-gradient(700px 500px at 50% 50%, rgba(53, 230, 255, .05), transparent 70%);
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: .55;
      background-image:
        linear-gradient(rgba(80, 140, 200, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(80, 140, 200, .045) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: radial-gradient(circle at 50% 40%, #000 40%, transparent 92%);
    }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(80, 140, 200, .25); border-radius: 10px; border: 2px solid transparent; background-clip: content-box; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(80, 140, 200, .45); background-clip: content-box; }

    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    .hidden { display: none !important; }

    /* ============================================================
       BOOT
       ============================================================ */
    #boot {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #02040a;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .6s ease, visibility .6s;
      cursor: pointer;
    }
    #boot.done { opacity: 0; visibility: hidden; }
    .boot-inner { width: min(680px, 88vw); font-family: var(--mono); }
    .boot-logo {
      font-size: clamp(38px, 8vw, 72px);
      font-weight: 800;
      letter-spacing: .22em;
      background: linear-gradient(90deg, var(--cyan), var(--blue) 45%, var(--magenta));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: glow 2.4s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { filter: drop-shadow(0 0 6px rgba(53, 230, 255, .25)); }
      to { filter: drop-shadow(0 0 24px rgba(53, 230, 255, .55)); }
    }
    .boot-sub { color: var(--muted); letter-spacing: .28em; font-size: 11px; margin-top: 6px; text-transform: uppercase; }
    .boot-log {
      margin: 26px 0 18px;
      height: 190px;
      overflow: hidden;
      font-size: 12.5px;
      line-height: 1.85;
      color: #8fb4d8;
    }
    .boot-log .ok { color: var(--green); }
    .boot-log .warn { color: var(--amber); }
    .boot-log .err { color: var(--magenta); }
    .boot-log .dim { color: #4a5f78; }
    .boot-bar { height: 3px; background: rgba(80, 140, 200, .15); border-radius: 3px; overflow: hidden; }
    .boot-bar i {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--cyan), var(--blue), var(--magenta));
      transition: width .35s ease;
      box-shadow: 0 0 14px rgba(53, 230, 255, .6);
    }
    .boot-skip {
      position: fixed;
      bottom: 24px;
      right: 26px;
      color: #4a5f78;
      font-size: 11px;
      letter-spacing: .14em;
      z-index: 10000;
    }

    /* ============================================================
       SHELL
       ============================================================ */
    .app { position: relative; z-index: 1; display: grid; grid-template-columns: 252px 1fr; height: 100vh; }
    .sidebar {
      background: linear-gradient(180deg, rgba(10, 16, 30, .95), rgba(6, 10, 20, .92));
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 18px 18px 16px; border-bottom: 1px solid var(--line); }
    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 17px;
      color: #02121a;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      box-shadow: 0 0 22px rgba(53, 230, 255, .35);
    }
    .brand-txt b { display: block; letter-spacing: .2em; font-size: 14px; }
    .brand-txt span { display: block; font-size: 10px; color: var(--muted); letter-spacing: .2em; text-transform: uppercase; }
    .nav { padding: 12px 10px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .nav button {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      color: #9db3cb;
      font-size: 13.2px;
      text-align: left;
      transition: .16s;
      border: 1px solid transparent;
      position: relative;
    }
    .nav button:hover { background: rgba(80, 140, 200, .09); color: var(--txt); }
    .nav button.active {
      background: linear-gradient(90deg, rgba(53, 230, 255, .16), rgba(59, 123, 255, .06));
      color: #fff;
      border-color: rgba(53, 230, 255, .32);
    }
    .nav button.active::before {
      content: '';
      position: absolute;
      left: -10px;
      top: 8px;
      bottom: 8px;
      width: 3px;
      border-radius: 3px;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
    }
    .nav .ico { width: 18px; text-align: center; font-size: 15px; }
    .nav .cnt {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 10.5px;
      background: rgba(80, 140, 200, .16);
      padding: 2px 7px;
      border-radius: 20px;
      color: #9db3cb;
    }
    .side-foot { padding: 12px 16px 16px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
    .api-pill { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; margin-bottom: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px currentColor; }
    .dot.off { background: var(--amber); box-shadow: 0 0 10px var(--amber); }

    .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(6, 10, 20, .6);
      backdrop-filter: blur(14px);
      position: relative;
      z-index: 40;
    }
    .search { position: relative; flex: 1; max-width: 620px; }
    .search input {
      width: 100%;
      background: rgba(13, 20, 36, .85);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 14px 10px 38px;
      outline: none;
      font-size: 13px;
      transition: .2s;
    }
    .search input:focus { border-color: rgba(53, 230, 255, .5); box-shadow: 0 0 0 3px rgba(53, 230, 255, .09); }
    .search::before {
      content: '⌕';
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 17px;
    }
    .search-results {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: var(--panel-2);
      border: 1px solid var(--line-2);
      border-radius: 12px;
      max-height: 380px;
      overflow-y: auto;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .6);
      backdrop-filter: blur(18px);
      display: none;
      z-index: 60;
    }
    .search-results.open { display: block; }
    .sr-item { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 10px; align-items: center; }
    .sr-item:hover { background: rgba(53, 230, 255, .07); }
    .sr-item:last-child { border-bottom: none; }
    .sr-empty { padding: 16px; color: var(--muted); text-align: center; font-size: 12.5px; }
    .top-actions { display: flex; align-items: center; gap: 9px; margin-left: auto; }
    .clock { font-family: var(--mono); font-size: 13px; color: #9db3cb; letter-spacing: .05em; padding: 0 6px; }
    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(13, 20, 36, .7);
      display: grid;
      place-items: center;
      font-size: 15px;
      position: relative;
      transition: .16s;
    }
    .icon-btn:hover { border-color: var(--line-2); background: rgba(53, 230, 255, .09); }
    .badge {
      position: absolute;
      top: -5px;
      right: -5px;
      min-width: 17px;
      height: 17px;
      border-radius: 9px;
      background: var(--magenta);
      font-size: 10px;
      font-weight: 700;
      display: grid;
      place-items: center;
      padding: 0 4px;
      color: #fff;
      box-shadow: 0 0 10px rgba(255, 46, 139, .7);
    }
    .content { flex: 1; overflow-y: auto; padding: 20px 22px 70px; min-height: 0; }

    /* ============================================================
       GENERIC UI
       ============================================================ */
    .sec-head { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
    .sec-head h1 { margin: 0; font-size: 21px; letter-spacing: .03em; font-weight: 650; }
    .sec-head p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
    .sec-head .spacer { flex: 1; }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 16px;
      backdrop-filter: blur(12px);
      transition: .2s;
    }
    .card:hover { border-color: var(--line-2); }
    .card h3 { margin: 0 0 12px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

    .grid { display: grid; gap: 14px; }
    .g4 { grid-template-columns: repeat(4, 1fr); }
    .g3 { grid-template-columns: repeat(3, 1fr); }
    .g2 { grid-template-columns: repeat(2, 1fr); }
    @media(max-width:1180px) { .g4 { grid-template-columns: repeat(2, 1fr); } }
    @media(max-width:900px) { .g4, .g3, .g2 { grid-template-columns: 1fr; } }

    .kpi { position: relative; overflow: hidden; }
    .kpi .lbl { font-size: 11px; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }
    .kpi .val { font-family: var(--mono); font-size: 31px; font-weight: 700; margin-top: 8px; line-height: 1; }
    .kpi .sub { font-size: 11.5px; color: var(--muted); margin-top: 7px; }
    .kpi::after {
      content: '';
      position: absolute;
      right: -30px;
      top: -30px;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent, rgba(53, 230, 255, .18)), transparent 70%);
    }
    .kpi.cyan { --accent: rgba(53, 230, 255, .2); }
    .kpi.magenta { --accent: rgba(255, 46, 139, .2); }
    .kpi.green { --accent: rgba(41, 224, 138, .2); }
    .kpi.amber { --accent: rgba(255, 176, 32, .2); }
    .kpi.flash { animation: flash .9s ease; }
    @keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(53, 230, 255, .6); } 100% { box-shadow: 0 0 0 22px rgba(53, 230, 255, 0); } }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      border: 1px solid color-mix(in srgb, var(--c, #35e6ff) 40%, transparent);
      background: color-mix(in srgb, var(--c, #35e6ff) 13%, transparent);
      color: var(--c, #35e6ff);
      white-space: nowrap;
    }
    .prio { padding: 3px 9px; border-radius: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .prio-low { background: rgba(127, 142, 163, .16); color: #9db3cb; }
    .prio-medium { background: rgba(53, 230, 255, .14); color: var(--cyan); }
    .prio-high { background: rgba(255, 176, 32, .16); color: var(--amber); }
    .prio-critical { background: rgba(255, 46, 139, .18); color: var(--magenta); animation: pulse 1.8s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 15px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 600;
      border: 1px solid var(--line-2);
      background: rgba(53, 230, 255, .09);
      color: var(--cyan);
      transition: .16s;
    }
    .btn:hover { background: rgba(53, 230, 255, .18); transform: translateY(-1px); }
    .btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
    .btn.primary { background: linear-gradient(135deg, var(--cyan), var(--blue)); color: #02121a; border-color: transparent; box-shadow: 0 6px 20px rgba(53, 230, 255, .22); }
    .btn.primary:hover { filter: brightness(1.1); }
    .btn.danger { color: var(--magenta); border-color: rgba(255, 46, 139, .4); background: rgba(255, 46, 139, .1); }
    .btn.danger:hover { background: rgba(255, 46, 139, .2); }
    .btn.ghost { background: transparent; color: #9db3cb; border-color: var(--line); }
    .btn.ghost:hover { background: rgba(80, 140, 200, .1); color: var(--txt); }
    .btn.sm { padding: 6px 11px; font-size: 11.5px; }

    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .field label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .field input, .field select, .field textarea {
      background: rgba(6, 11, 22, .85);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 10px 12px;
      outline: none;
      font-size: 13px;
      transition: .16s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: rgba(53, 230, 255, .5); box-shadow: 0 0 0 3px rgba(53, 230, 255, .08); }
    .field textarea { resize: vertical; min-height: 90px; font-family: inherit; }
    .note { font-size: 11.5px; color: var(--muted); line-height: 1.6; border-left: 2px solid var(--line-2); padding-left: 11px; margin-top: 6px; }
    .note.warn { border-color: var(--amber); color: #c8a45f; }

    /* ============================================================
       REQUEST CARDS
       ============================================================ */
    .req-list { display: flex; flex-direction: column; gap: 10px; }
    .req-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 3px solid var(--c, var(--cyan));
      border-radius: 12px;
      padding: 13px 15px;
      cursor: pointer;
      transition: .18s;
      position: relative;
    }
    .req-card:hover { border-color: var(--line-2); transform: translateX(3px); background: rgba(18, 28, 50, .8); }
    .req-card[data-priority="critical"] { border-left-color: var(--magenta); box-shadow: inset 0 0 30px rgba(255, 46, 139, .06); }
    .req-card[data-priority="high"] { border-left-color: var(--amber); }
    .req-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .req-id { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .06em; }
    .req-card h4 { margin: 0 0 5px; font-size: 14px; font-weight: 600; line-height: 1.35; }
    .req-card p { margin: 0; color: var(--muted); font-size: 12.3px; line-height: 1.55; }
    .req-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 11px; font-size: 11px; color: var(--muted); }
    .req-foot .xp { font-family: var(--mono); color: var(--green); font-weight: 700; }
    .status { padding: 2.5px 9px; border-radius: 20px; font-size: 10.5px; font-weight: 600; letter-spacing: .04em; }
    .s-received, .s-new { background: rgba(59, 123, 255, .16); color: #7fa8ff; }
    .s-accepted { background: rgba(53, 230, 255, .15); color: var(--cyan); }
    .s-in_progress { background: rgba(255, 176, 32, .16); color: var(--amber); }
    .s-submitted { background: rgba(160, 120, 255, .18); color: #b79cff; }
    .s-resolved, .s-verified { background: rgba(41, 224, 138, .15); color: var(--green); }
    .s-closed { background: rgba(127, 142, 163, .15); color: #9db3cb; }
    .sim-badge { font-size: 9.5px; letter-spacing: .1em; color: var(--amber); border: 1px dashed rgba(255, 176, 32, .45); padding: 1.5px 6px; border-radius: 5px; }

    /* ============================================================
       FEED / TIMELINE
       ============================================================ */
    .feed { display: flex; flex-direction: column; gap: 2px; max-height: 340px; overflow-y: auto; }
    .feed-item { display: flex; gap: 11px; padding: 10px 4px; border-bottom: 1px solid var(--line); cursor: pointer; transition: .15s; }
    .feed-item:hover { background: rgba(53, 230, 255, .05); }
    .feed-item:last-child { border-bottom: none; }
    .feed-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; box-shadow: 0 0 9px currentColor; }
    .feed-body { min-width: 0; flex: 1; }
    .feed-body b { display: block; font-size: 12.6px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .feed-body span { font-size: 11px; color: var(--muted); }

    /* ============================================================
       SECTOR CARDS
       ============================================================ */
    .sector-card { position: relative; overflow: hidden; cursor: pointer; }
    .sector-card .sc-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .sector-card .sc-ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 17px; background: color-mix(in srgb, var(--c) 16%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
    .sector-card .sc-name { font-size: 13.5px; font-weight: 600; }
    .sector-card .sc-bar { height: 5px; border-radius: 4px; background: rgba(80, 140, 200, .14); overflow: hidden; margin: 10px 0 8px; }
    .sector-card .sc-bar i { display: block; height: 100%; background: var(--c); border-radius: 4px; box-shadow: 0 0 12px var(--c); transition: width .6s ease; }
    .sector-card .sc-stats { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-family: var(--mono); }

    /* ============================================================
       FILTERS
       ============================================================ */
    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
    .filters select { background: rgba(13, 20, 36, .85); border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; font-size: 12.5px; outline: none; }
    .filters select:focus { border-color: rgba(53, 230, 255, .45); }
    .chip { padding: 6px 13px; border-radius: 20px; border: 1px solid var(--line); font-size: 12px; color: #9db3cb; transition: .15s; }
    .chip:hover { border-color: var(--line-2); color: var(--txt); }
    .chip.on { background: rgba(53, 230, 255, .14); border-color: rgba(53, 230, 255, .45); color: var(--cyan); }

    /* ============================================================
       KANBAN
       ============================================================ */
    .kanban { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; align-items: start; }
    @media(max-width:1100px) { .kanban { grid-template-columns: repeat(2, 1fr); } }
    @media(max-width:680px) { .kanban { grid-template-columns: 1fr; } }
    .kcol { background: rgba(9, 15, 28, .6); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-height: 120px; }
    .kcol h4 { margin: 0 0 11px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
    .kcol .mini {
      background: rgba(13, 20, 36, .85);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: .15s;
      border-left: 3px solid var(--c, var(--cyan));
    }
    .kcol .mini:hover { border-color: var(--line-2); transform: translateY(-2px); }
    .kcol .mini b { display: block; font-size: 12.3px; font-weight: 600; margin-bottom: 5px; line-height: 1.35; }
    .kcol .mini span { font-size: 10.5px; color: var(--muted); font-family: var(--mono); }

    /* ============================================================
       MAP + PLANET
       ============================================================ */
    .map-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      background: rgba(13, 20, 36, .65);
      padding: 5px;
      border-radius: 12px;
      border: 1px solid var(--line);
      width: fit-content;
    }
    .map-tabs button {
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 12.5px;
      color: var(--muted);
      transition: .16s;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      letter-spacing: .02em;
    }

<script>
  /* ================================================================
     ZENITH — TERRA NOVA COMMAND CENTER
     ================================================================ */
  (function() {
    'use strict';

    /* ============================================================
       0. UTILITIES
       ============================================================ */
    const $ = (s, r = document) => r.querySelector(s);
    const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const pick = a => a[Math.floor(Math.random() * a.length)];

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const fmtNum = n => new Intl.NumberFormat('fr-FR').format(Math.round(n));
    const uid = () => 'REQ-' + String(State.seq++).padStart(4, '0');
    function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
    function timeAgo(ts) {
      const s = (Date.now() - ts) / 1000;
      if (s < 45) return "à l'instant";
      if (s < 3600) return 'il y a ' + Math.floor(s / 60) + ' min';
      if (s < 86400) return 'il y a ' + Math.floor(s / 3600) + ' h';

    }
    const fmtTime = ts => new Date(ts).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    const fmtDT = ts => new Date(ts).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    const truncate = (s, n) => s.length > n ? s.slice(0, n).trim() + '…' : s;

    /* ============================================================
       1. DOMAIN CONSTANTS
       ============================================================ */
    const SECTORS = {
      transport: { key: 'transport', label: 'Transport', icon: '🚄', color: '#35e6ff' },
      security: { key: 'security', label: 'Sécurité', icon: '🛡️', color: '#ff2e8b' },

      low: { key: 'low', label: 'Basse', color: '#7f8ea3' },

      { key: 'requests', label: 'Demandes en direct', icon: '≡' },
      { key: 'operations', label: 'Opérations', icon: '⚙' },
      { key: 'map', label: 'Carte & Planète', icon: '◎' },
      { key: 'analytics', label: 'Analytique', icon: '▤' },
      { key: 'citizens', label: 'Citoyens', icon: '☺' },
      { key: 'alerts', label: 'Alertes', icon: '⚠' },
      { key: 'council', label: 'Haut Conseil', icon: '⌂' },
      { key: 'settings', label: 'Paramètres', icon: '⚒' }
    ];

    /* ============================================================
       2. STATE + STORAGE
       ============================================================ */
    const STORAGE_KEY = 'zenith.terranova.v2';

    const State = {
      requests: [],
      xp: 0,
      notifications: [],
      seq: 1,
      sessionStart: Date.now(),
      lastSync: null,
      apiOnline: false,
      settings: {
        apiUrl: '',
        apiKey: '',
        demoMode: true,
        simInterval: 15000,
        autoSim: true,
        theme: 'dark'
      },
      ui: {
        section: 'command',
        filters: { sector: 'all', status: 'all', difficulty: 'all', priority: 'all' },
        selectedId: null,
        simTimer: null,
        demoRunning: false,
        mapMode: 'city'
      }
    };

    const Storage = {
      save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            requests: State.requests.slice(-260),
            xp: State.xp,
            notifications: State.notifications.slice(-120),
            seq: State.seq,
            sessionStart: State.sessionStart,
            settings: State.settings
          }));
        } catch (e) {}
      },
      load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return false;
          const d = JSON.parse(raw);
          if (d.requests) State.requests = d.requests;
          if (typeof d.xp === 'number') State.xp = d.xp;
          if (d.notifications) State.notifications = d.notifications;
          if (d.seq) State.seq = d.seq;
          if (d.sessionStart) State.sessionStart = d.sessionStart;
          if (d.settings) Object.assign(State.settings, d.settings);
          return true;
        } catch (e) { return false; }
      },
      clear() {
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      }
    };
    let saveTimer = null;
    function persist() { clearTimeout(saveTimer); saveTimer = setTimeout(Storage.save, 400); }

    /* ============================================================
       3. XP ENGINE
       ============================================================ */
    const XPEngine = {
      base(difficulty) { return (DIFFICULTIES[difficulty] || {}).xp || 0; },
      lateBonus(difficulty, createdAt) {
        const hours = Math.max(0, (createdAt - State.sessionStart) / 3600000);
        const ratio = clamp(hours / 24, 0, 1);
        return Math.round(this.base(difficulty) * 0.5 * ratio);
      },
      total(difficulty, lateBonus) { return this.base(difficulty) + (lateBonus || 0); },
      award(request) {
        State.xp += request.totalXP || 0;
        persist();
        return request.totalXP || 0;
      }
    };

    /* ============================================================
       4. DEMO DATA
       ============================================================ */
    const TEMPLATES = {
      transport: [
        { t: 'Navette Maglev ligne 3 immobilisée', d: "La navette Maglev de la ligne 3 est à l'arrêt en station Aurora depuis plus de 40 minutes. Les voyageurs demandent une information en temps réel et une navette de remplacement.", l: 'Station Aurora — Ligne 3' },
        { t: 'Signalisation défaillante au hub central', d: "Les panneaux d'information voyageurs du hub central n'affichent plus les temps d'attente. Un affichage temporaire est nécessaire aux heures de pointe.", l: 'Hub Central — Niveau 2' },
        { t: 'Demande de navette pour le secteur Est', d: "Les habitants du secteur Est demandent une desserte supplémentaire le matin entre 07h00 et 09h00 pour rejoindre les dômes agricoles.", l: 'Secteur Est — Arrêt 12' },
        { t: 'Recharge des véhicules de service', d: "Plusieurs véhicules de service sont bloqués faute de bornes de recharge fonctionnelles près du dépôt logistique.", l: 'Dépôt logistique Nord' },
        { t: 'Passerelle piétonne endommagée', d: "Une section de la passerelle piétonne reliant les quartiers C et D présente un revêtement dégradé. Un balisage et une réparation sont demandés.", l: 'Passerelle C–D' }
      ],
      security: [
        { t: 'Éclairage public défaillant — secteur D', d: "Une dizaine de luminaires du secteur D ne fonctionnent plus, ce qui rend le trajet nocturne difficile et peu sûr pour les habitants.", l: 'Secteur D — Rue 7' },
        { t: 'Incident signalé à la station orbitale', d: "Un incident mineur a été signalé à l'entrée de la station orbitale. Les habitants demandent une présence de sécurité renforcée.", l: 'Station orbitale — Accès principal' },
        { t: 'Portail d\'accès resté ouvert', d: "Le portail automatique du bloc résidentiel 4 est resté ouvert toute la nuit. Un contrôle technique est demandé.", l: 'Bloc résidentiel 4' },
        { t: 'Renfort pour la place publique', d: "Des rassemblements importants sont attendus place centrale ce soir. Une présence de coordination est souhaitée.", l: 'Place centrale' },
        { t: 'Caméra de surveillance hors service', d: "La caméra couvrant le croisement principal ne transmet plus d'image depuis 3 jours.", l: 'Croisement principal — Zone B' }
      ],
      environment: [
        { t: 'Qualité de l\'air dégradée — zone industrielle', d: "Les capteurs signalent une hausse des particules fines près de la zone industrielle. Les habitants demandent une information claire et des mesures.", l: 'Zone industrielle — Capteur 07' },
        { t: 'Fuite d\'eau au niveau du dôme 3', d: "Une fuite importante est signalée sur la conduite principale alimentant le dôme 3. Une intervention rapide est nécessaire.", l: 'Dôme 3 — Conduite principale' },
        { t: 'Bacs de recyclage saturés', d: "Les bacs de recyclage du quartier Sud n'ont pas été collectés cette semaine et débordent.", l: 'Quartier Sud — Îlot 5' },
        { t: 'Baisse de rendement des panneaux solaires', d: "Le rendement des panneaux solaires du champ Est a chuté de 18 % en trois jours.", l: 'Champ solaire Est' },
        { t: 'Signalement de bruit continu', d: "Un bruit continu provenant d'une unité technique perturbe les habitants la nuit.", l: 'Unité technique — Secteur A' }
      ],
      daily: [
        { t: 'Accès aux services civiques en ligne', d: "Plusieurs habitants signalent ne pas pouvoir accéder au portail des services civiques depuis la mise à jour.", l: 'Portail civique' },
        { t: 'Demande d\'information sur les aides', d: "Des familles nouvellement installées demandent des informations sur les aides à l'installation.", l: 'Centre d\'accueil — Dôme 1' },
        { t: 'Espace public à réaménager', d: "Les habitants du quartier Ouest souhaitent réaménager une place inutilisée en espace de rencontre.", l: 'Quartier Ouest — Place 2' },
        { t: 'Éclairage de l\'aire de jeux', d: "L'aire de jeux du dôme 2 n'est plus éclairée le soir, les familles demandent une remise en service.", l: 'Dôme 2 — Aire de jeux' },
        { t: 'Signalement d\'un accès difficile', d: "Une rampe d'accès est trop raide pour les personnes à mobilité réduite.", l: 'Bâtiment administratif B' }
      ]
    };

    const CITIZENS = (() => {
      const arr = [];
      for (let i = 1; i <= 26; i++) arr.push('CIT-' + String(i).padStart(4, '0'));
      arr.push('HC-0001', 'HC-0002');
      return arr;
    })();

    function randomDifficulty() {
      const r = Math.random();
      if (r < 0.34) return 'facile';
      if (r < 0.68) return 'moyenne';
      if (r < 0.89) return 'difficile';
      return 'expert';
    }
    function randomPriority(difficulty, sector) {
      let r = Math.random();
      if (difficulty === 'expert') r += 0.35;
      if (sector === 'security') r += 0.12;
      if (r > 0.93) return 'critical';
      if (r > 0.72) return 'high';
      if (r > 0.34) return 'medium';
      return 'low';
    }

    function buildRequest(opts) {
      opts = opts || {};
      const sector = opts.sector || pick(SECTOR_KEYS);
      const tpl = pick(TEMPLATES[sector]);
      const difficulty = opts.difficulty || randomDifficulty();
      const createdAt = opts.createdAt || Date.now();
      const lateBonus = opts.lateBonus != null ? opts.lateBonus : XPEngine.lateBonus(difficulty, createdAt);
      const base = XPEngine.base(difficulty);
      const id = opts.id || uid();

      return {
        id,
        title: opts.title || tpl.t,
        description: opts.description || tpl.d,
        sector,
        difficulty,
        baseXP: base,
        lateBonus,
        totalXP: base + lateBonus,
        status: opts.status || 'new',
        priority: opts.priority || randomPriority(difficulty, sector),
        location: opts.location || tpl.l,
        citizen: opts.citizen || pick(CITIZENS),
        createdAt,
        updatedAt: createdAt,
        simulated: opts.simulated !== false,
        wave: opts.wave || 1,
        checklist: (opts.checklist || [
          'Analyser la demande et vérifier les informations',
          'Identifier les services et équipes concernés',
          'Appliquer la solution sur le terrain',
          'Informer le citoyen et documenter l\'intervention'
        ]).map(text => ({ text, done: false })),
        solution: opts.solution || '',
        history: opts.history || [{ status: 'received', at: createdAt }]
      };
    }

    function seedDemoData() {
      const now = Date.now();
      const seeds = [
        { sector: 'transport', difficulty: 'moyenne', priority: 'high', status: 'new', age: 9 },
        { sector: 'security', difficulty: 'expert', priority: 'critical', status: 'new', age: 14 },
        { sector: 'environment', difficulty: 'difficile', priority: 'high', status: 'accepted', age: 26 },
        { sector: 'daily', difficulty: 'facile', priority: 'low', status: 'resolved', age: 52 },
        { sector: 'transport', difficulty: 'facile', priority: 'medium', status: 'new', age: 33 },
        { sector: 'daily', difficulty: 'moyenne', priority: 'medium', status: 'in_progress', age: 41 },
        { sector: 'environment', difficulty: 'moyenne', priority: 'medium', status: 'resolved', age: 76 },
        { sector: 'security', difficulty: 'moyenne', priority: 'high', status: 'verified', age: 88 }
      ];
      seeds.forEach(s => {
        const createdAt = now - s.age * 60000;
        const r = buildRequest({
          sector: s.sector, difficulty: s.difficulty, priority: s.priority,
          status: s.status, createdAt, wave: 1
        });
        r.lateBonus = 0;
        r.totalXP = r.baseXP;
        r.history = [{ status: 'received', at: createdAt }, { status: s.status, at: createdAt + 60000 }];
        if (s.status === 'resolved' || s.status === 'verified') {
          r.solution = 'Intervention réalisée et vérifiée sur site. Le citoyen a été informé.';
          r.checklist.forEach(c => c.done = true);
        }
        State.requests.push(r);
      });
    }

    /* ============================================================
       5. API MANAGER
       ============================================================ */
    const APIManager = {
      configured() { return !!State.settings.apiUrl; },
      headers() {
        const h = { 'Accept': 'application/json' };
        if (State.settings.apiKey) h['X-API-Key'] = State.settings.apiKey;
        return h;
      },
      async test() {
        if (!this.configured()) {
          State.apiOnline = false;
          return { ok: false, message: "Aucun endpoint renseigné. Renseignez l'URL officielle de l'API Terra Nova." };
        }
        try {
          const res = await fetch(State.settings.apiUrl, { headers: this.headers() });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          State.apiOnline = true;
          State.lastSync = Date.now();
          return { ok: true, message: 'Connexion établie — HTTP ' + res.status };
        } catch (e) {
          State.apiOnline = false;
          return { ok: false, message: 'Échec de connexion : ' + e.message + '. Bascule en mode démo.' };
        }
      },
      normalize(raw) {
        const difficulty = String(raw.difficulty || raw.difficulte || 'moyenne').toLowerCase();
        const diffKey = DIFFICULTIES[difficulty] ? difficulty :
          (difficulty.startsWith('fac') ? 'facile' :
            difficulty.startsWith('dif') ? 'difficile' :
              difficulty.startsWith('exp') ? 'expert' : 'moyenne');
        const sectorRaw = String(raw.sector || raw.secteur || 'daily').toLowerCase();
        const sectorKey = SECTORS[sectorRaw] ? sectorRaw :
          (sectorRaw.includes('transp') ? 'transport' :
            sectorRaw.includes('secu') ? 'security' :
              sectorRaw.includes('env') ? 'environment' : 'daily');
        const createdAt = raw.createdAt ? new Date(raw.createdAt).getTime() : Date.now();
        const lateBonus = XPEngine.lateBonus(diffKey, createdAt);
        const base = XPEngine.base(diffKey);
        return {
          id: raw.id || raw.reference || uid(),
          title: raw.title || raw.titre || 'Demande sans titre',
          description: raw.description || '',
          sector: sectorKey,
          difficulty: diffKey,
          baseXP: base,
          lateBonus,
          totalXP: base + lateBonus,
          status: 'new',
          priority: raw.priority || randomPriority(diffKey, sectorKey),
          location: raw.location || raw.lieu || 'Localisation non précisée',
          citizen: raw.citizen || raw.citoyen || 'CIT-0000',
          createdAt,
          updatedAt: createdAt,
          simulated: false,
          wave: raw.wave || 1,
          checklist: [
            'Analyser la demande et vérifier les informations',
            'Identifier les services et équipes concernés',
            'Appliquer la solution sur le terrain',
            'Informer le citoyen et documenter l\'intervention'
          ].map(text => ({ text, done: false })),
          solution: '',
          history: [{ status: 'received', at: createdAt }]
        };
      },
      async fetchNew() {
        if (!this.configured()) return [];
        try {
          const res = await fetch(State.settings.apiUrl, { headers: this.headers() });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          const list = Array.isArray(data) ? data : (data.requests || data.demandes || data.data || []);
          State.apiOnline = true;
          State.lastSync = Date.now();
          return list.map(x => this.normalize(x));
        } catch (e) {
          State.apiOnline = false;
          return [];
        }
      }
    };

    /* ============================================================
       6. REQUEST MANAGER
       ============================================================ */
    const RequestManager = {
      get(id) { return State.requests.find(r => r.id === id); },
      active() { return State.requests.filter(r => statusIndex(r.status) < statusIndex('closed')); },
      unresolved() { return State.requests.filter(r => statusIndex(r.status) < statusIndex('resolved')); },
      resolved() { return State.requests.filter(r => statusIndex(r.status) >= statusIndex('resolved')); },
      critical() { return State.requests.filter(r => r.priority === 'critical' && statusIndex(r.status) < statusIndex('resolved')); },

      add(request, opts) {
        opts = opts || {};
        State.requests.unshift(request);
        if (State.requests.length > 300) State.requests.length = 300;
        if (opts.notify !== false) {
          const urgent = request.priority === 'critical';
          Notifications.add(
            urgent ? 'critical' : 'new',
            urgent ? 'Demande critique reçue' : 'Nouvelle demande détectée',
            request.id + ' — ' + request.title,
            request.id
          );
          if (urgent) toast('critical', 'ALERTE CRITIQUE', request.id + ' nécessite une réponse immédiate.');
        }
        persist();
        return request;
      },

      setStatus(id, status) {
        const r = this.get(id);
        if (!r) return null;
        r.status = status;
        r.updatedAt = Date.now();
        r.history.push({ status, at: r.updatedAt });
        if (status === 'resolved') {
          const gained = XPEngine.award(r);
          Notifications.add('xp', 'XP attribués', '+' + fmtNum(gained) + ' XP pour ' + r.id + ' (' + r.title + ')', r.id);
          toast('xp', 'XP ATTRIBUÉS', '+' + fmtNum(gained) + ' XP — ' + r.id);
        } else if (status === 'verified') {
          Notifications.add('resolved', 'Solution vérifiée', r.id + ' — ' + r.title, r.id);
        } else if (status === 'closed') {
          Notifications.add('info', 'Demande clôturée', r.id + ' — ' + r.title, r.id);
        }
        persist();
        return r;
      },

      filtered() {
        const f = State.ui.filters;
        return State.requests.filter(r => {
          if (f.sector !== 'all' && r.sector !== f.sector) return false;
          if (f.status !== 'all' && r.status !== f.status) return false;
          if (f.difficulty !== 'all' && r.difficulty !== f.difficulty) return false;
          if (f.priority !== 'all' && r.priority !== f.priority) return false;
          return true;
        });
      },

      search(q) {
        q = q.trim().toLowerCase();
        if (!q) return [];
        return State.requests.filter(r =>
          r.id.toLowerCase().includes(q) ||
          r.title.toLowerCase().includes(q) ||
          r.description.toLowerCase().includes(q) ||
          r.location.toLowerCase().includes(q) ||
          r.citizen.toLowerCase().includes(q) ||
          SECTORS[r.sector].label.toLowerCase().includes(q) ||
          statusLabel(r.status).toLowerCase().includes(q) ||
          r.difficulty.toLowerCase().includes(q)
        ).slice(0, 20);
      },

      stats() {
        const all = State.requests;
        const res = this.resolved().length;
        const total = all.length || 1;
        const respTimes = all.filter(r => statusIndex(r.status) >= statusIndex('resolved'))
          .map(r => (r.updatedAt - r.createdAt) / 3600000);
        const avgResp = respTimes.length ? respTimes.reduce((a, b) => a + b, 0) / respTimes.length : 0;
        return {
          total: all.length,
          active: this.unresolved().length,
          critical: this.critical().length,
          resolved: res,
          rate: Math.round((res / total) * 100),
          avgResponse: avgResp
        };
      },

      bySector() {
        const out = {};
        SECTOR_KEYS.forEach(k => { out[k] = { total: 0, resolved: 0, active: 0, critical: 0, xp: 0 }; });
        State.requests.forEach(r => {
          const s = out[r.sector];
          s.total++;
          s.xp += r.totalXP;
          if (statusIndex(r.status) >= statusIndex('resolved')) s.resolved++; else s.active++;
          if (r.priority === 'critical' && statusIndex(r.status) < statusIndex('resolved')) s.critical++;
        });
        return out;
      },

      byDifficulty() {
        const out = {};
        Object.keys(DIFFICULTIES).forEach(k => out[k] = 0);
        State.requests.forEach(r => out[r.difficulty]++);
        return out;
      },

      byStatus() {
        const out = {};
        STATUS_KEYS.forEach(k => out[k] = 0);
        State.requests.forEach(r => out[r.status]++);
        return out;
      },

      byCitizen() {
        const map = {};
        State.requests.forEach(r => {
          if (!map[r.citizen]) map[r.citizen] = { id: r.citizen, total: 0, resolved: 0, sectors: {} };
          map[r.citizen].total++;
          if (statusIndex(r.status) >= statusIndex('resolved')) map[r.citizen].resolved++;
          map[r.citizen].sectors[r.sector] = (map[r.citizen].sectors[r.sector] || 0) + 1;
        });
        return Object.values(map).sort((a, b) => b.total - a.total);
      },

      xpByHour() {
        const buckets = new Array(12).fill(0);
        State.requests.forEach(r => {
          if (statusIndex(r.status) < statusIndex('resolved')) return;
          const h = Math.floor((r.createdAt - State.sessionStart) / 3600000);
          const idx = clamp(h, 0, 11);
          buckets[idx] += r.totalXP;
        });
        return buckets;
      }
    };

    /* ============================================================
       7. NOTIFICATIONS
       ============================================================ */
    const Notifications = {
      ICONS: {
        critical: { i: '⚠', c: '#ff2e8b' },
        new: { i: '＋', c: '#35e6ff' },
        resolved: { i: '✓', c: '#29e08a' },
        xp: { i: '★', c: '#ffb020' },
        info: { i: '•', c: '#3b7bff' }
      },
      add(type, title, body, requestId) {
        State.notifications.unshift({
          id: 'N-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
          type, title, body, requestId: requestId || null,
          at: Date.now(), read: false
        });
        if (State.notifications.length > 150) State.notifications.length = 150;
        persist();
        renderNotifPanel();
        updateBadge();
      },
      markRead(id) {
        const n = State.notifications.find(x => x.id === id);
        if (n) n.read = true;
        persist(); renderNotifPanel(); updateBadge();
      },
      markAllRead() {
        State.notifications.forEach(n => n.read = true);
        persist(); renderNotifPanel(); updateBadge();
      },
      unread() { return State.notifications.filter(n => !n.read).length; }
    };

    function updateBadge() {
      const n = Notifications.unread();
      const b = $('#notifBadge');
      if (!b) return;
      b.textContent = n > 99 ? '99+' : n;
      b.classList.toggle('hidden', n === 0);
    }

    function renderNotifPanel() {
      const list = $('#npList');
      if (!list) return;
      if (!State.notifications.length) {
        list.innerHTML = '<div class="sr-empty">Aucune notification pour le moment.</div>';
        return;
      }
      list.innerHTML = State.notifications.map(n => {
        const meta = Notifications.ICONS[n.type] || Notifications.ICONS.info;
        return '<div class="np-item ' + (n.read ? '' : 'unread') + '" data-action="notif-click" data-id="' + n.id + '">' +
          '<div class="np-ico" style="background:' + meta.c + '22;border:1px solid ' + meta.c + '55;color:' + meta.c + '">' + meta.i + '</div>' +
          '<div class="np-txt"><b>' + esc(n.title) + '</b><p>' + esc(n.body) + '</p><time>' + timeAgo(n.at) + '</time></div>' +
          '</div>';
      }).join('');
    }

    /* ============================================================
       8. TOASTS
       ============================================================ */
    function toast(type, title, body, duration) {
      const colors = { critical: '#ff2e8b', new: '#35e6ff', xp: '#ffb020', resolved: '#29e08a', info: '#3b7bff' };
      const node = document.createElement('div');
      node.className = 'toast';
      node.style.setProperty('--c', colors[type] || '#35e6ff');
      node.innerHTML = '<b>' + esc(title) + '</b><p>' + esc(body) + '</p>';
      $('#toasts').appendChild(node);
      setTimeout(() => {
        node.classList.add('out');
        setTimeout(() => node.remove(), 320);
      }, duration || 4200);
    }

    /* ============================================================
       9. SHARED RENDER HELPERS
       ============================================================ */
    function sectorPill(key) {
      const s = SECTORS[key];
      return '<span class="pill" style="--c:' + s.color + '">' + s.icon + ' ' + s.label + '</span>';
    }
    function diffPill(key) {
      const d = DIFFICULTIES[key];
      return '<span class="pill" style="--c:' + d.color + '">' + d.label + '</span>';
    }
    function prioBadge(key) {
      return '<span class="prio prio-' + key + '">' + PRIORITIES[key].label + '</span>';
    }
    function statusBadge(key) {
      return '<span class="status s-' + key + '">' + statusLabel(key) + '</span>';
    }

    function requestCard(r) {
      return '<article class="req-card" data-action="open-request" data-id="' + r.id + '" ' +
        'data-priority="' + r.priority + '" style="--c:' + SECTORS[r.sector].color + '">' +
        '<div class="req-top">' +
        '<span class="req-id">' + r.id + '</span>' +
        sectorPill(r.sector) + diffPill(r.difficulty) + prioBadge(r.priority) +
        (r.simulated ? '<span class="sim-badge">SIMULÉ</span>' : '') +
        '</div>' +
        '<h4>' + esc(r.title) + '</h4>' +
        '<p>' + esc(truncate(r.description, 130)) + '</p>' +
        '<div class="req-foot">' +
        statusBadge(r.status) +
        '<span>📍 ' + esc(r.location) + '</span>' +
        '<span>☺ ' + esc(r.citizen) + '</span>' +
        '<span class="xp">+' + fmtNum(r.totalXP) + ' XP</span>' +
        '<span style="margin-left:auto">' + timeAgo(r.createdAt) + '</span>' +
        '</div>' +
        '</article>';
    }

    function emptyState(msg) {
      return '<div class="card" style="text-align:center;padding:44px 20px;color:var(--muted)">' +
        '<div style="font-size:30px;margin-bottom:10px;opacity:.4">◇</div>' + esc(msg) + '</div>';
    }

    function kpi(variant, label, value, sub) {
      return '<div class="card kpi ' + variant + '" data-kpi="' + label + '">' +
        '<div class="lbl">' + esc(label) + '</div>' +
        '<div class="val">' + value + '</div>' +
        '<div class="sub">' + esc(sub) + '</div>' +
        '</div>';
    }

    /* ============================================================
       10. SECTION RENDERERS
       ============================================================ */
    function renderCommand() {
      const st = RequestManager.stats();
      const byS = RequestManager.bySector();
      const feed = State.requests.slice(0, 9);
      const criticals = RequestManager.critical();

      function genBuildings(bbox, color, density) {
        let out = '';

        for (let x = bbox.x; x < bbox.x + bbox.w; x += cellW) {
          for (let y = bbox.y; y < bbox.y + bbox.h; y += cellH) {
            if (R() > density) continue;
            const bw = 6 + R() * 8;
            const bh = 5 + R() * 7;
            const op = 0.12 + R() * 0.35;
            const ox = x + R() * 5;
            const oy = y + R() * 4;
            const tall = R() > 0.88;
            out += '<rect x="' + ox.toFixed(1) + '" y="' + oy.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + bh.toFixed(1) + '" fill="' + color + '" opacity="' + (tall ? Math.min(op + 0.28, 0.85) : op).toFixed(2) + '" rx="0.8"/>';
          }
        }
        return out;

      const clipDefs = districts.map(d =>

          }
          markers += '<circle cx="' + mx.toFixed(1) + '" cy="' + my.toFixed(1) + '" r="8" fill="' + d.color + '" opacity="0.25"/>' +
            '<circle cx="' + mx.toFixed(1) + '" cy="' + my.toFixed(1) + '" r="4.5" fill="' + d.color + '" stroke="#02121a" stroke-width="0.8"/>' +
            '<circle cx="' + mx.toFixed(1) + '" cy="' + my.toFixed(1) + '" r="1.8" fill="#fff" opacity="0.9"/>' +
            '<title>' + esc(r.id + ' — ' + r.title) + '</title>' +
            '</g>';
        });
      });

      return '<div class="map-wrap">' +
        '<svg class="map-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">' +
        '<defs>' +
        '<radialGradient id="mapBg" cx="50%" cy="50%" r="75%">' +
        '<stop offset="0%" stop-color="#0a1a30"/>' +
        '<stop offset="60%" stop-color="#050d1c"/>' +
        '<stop offset="100%" stop-color="#02040a"/>' +
        '</radialGradient>' +
        '<radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">' +
        '<stop offset="0%" stop-color="#35e6ff" stop-opacity="0.5"/>' +
        '<stop offset="50%" stop-color="#35e6ff" stop-opacity="0.15"/>' +
        '<stop offset="100%" stop-color="#35e6ff" stop-opacity="0"/>' +
        '</radialGradient>' +
        '<radialGradient id="hubCore" cx="50%" cy="50%" r="50%">' +
        '<stop offset="0%" stop-color="#35e6ff" stop-opacity="0.8"/>' +
        '<stop offset="70%" stop-color="#3b7bff" stop-opacity="0.3"/>' +
        '<stop offset="100%" stop-color="#3b7bff" stop-opacity="0"/>' +
        '</radialGradient>' +
        '<filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">' +
        '<feGaussianBlur stdDeviation="3"/>' +
        '</filter>' +
        '<pattern id="cityGrid" width="24" height="24" patternUnits="userSpaceOnUse">' +
        '<path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(80,140,200,0.05)" stroke-width="0.5"/>' +
        '</pattern>' +
        clipDefs +
        '</defs>' +
        '<rect width="' + W + '" height="' + H + '" fill="url(#mapBg)"/>' +
        '<rect width="' + W + '" height="' + H + '" fill="url(#cityGrid)"/>' +
        water +
        buildingGroups +
        '<g>' + streetGrid + '</g>' +
        sectorOverlays +
        '<g>' + secondaryRoads + '</g>' +
        '<g>' + avenueH + avenueV + '</g>' +
        ringRoad +
        highways +
        landmarks +
        hub +
        sectorLabels +
        '<g>' + markers + '</g>' +
        '</svg>' +
        '</div>';
    }

    function renderPlanetView() {
      return '<div class="planet-wrap" id="planetWrap">' +
        '<div id="planetContainer"></div>' +
        '<div id="planetLabels"></div>' +
        '<div class="planet-overlay-ui">' +
        '<b>TERRA NOVA · SYSTÈME PLANÉTAIRE</b>' +
        '<span><span class="k">Classe</span> — Planète tellurique</span>' +
        '<span><span class="k">Régions</span> — 4 secteurs opérationnels</span>' +
        '<span><span class="k">Population</span> — ' + fmtNum(CITIZENS.length + 1180) + ' citoyens</span>' +
        '<span><span class="k">Statut</span> — En développement actif</span>' +
        '</div>' +
        '<div class="planet-hint"><i></i>Cliquez et glissez pour orienter la planète</div>' +
        '<div class="planet-loading" id="planetLoading">' +
        '<div style="display:flex;flex-direction:column;align-items:center">' +
        '<div class="pl-spin"></div>' +
        '<div>Initialisation du modèle 3D…</div>' +
        '</div>' +
        '</div>' +
        '</div>';
    }

    /* ============================================================
       11. 3D PLANET (Three.js)
       ============================================================ */
    let planet3D = { scene: null, camera: null, renderer: null, stop: null, dispose: null };

    function destroyPlanet3D() {
      if (planet3D.stop) { try { planet3D.stop(); } catch (e) {} }
      if (planet3D.dispose) { try { planet3D.dispose(); } catch (e) {} }
      planet3D = { scene: null, camera: null, renderer: null, stop: null, dispose: null };
    }

    function initPlanet3D() {
      const container = document.getElementById('planetContainer');
      const labelsRoot = document.getElementById('planetLabels');
      const loading = document.getElementById('planetLoading');
      if (!container) return;

      if (typeof THREE === 'undefined') {
        if (loading) loading.outerHTML = '<div class="planet-error">⚠ Moteur 3D indisponible.<br><span style="font-size:11px;color:var(--muted)">Vérifiez votre connexion réseau pour charger Three.js.</span></div>';
        return;
      }

      const wrap = document.getElementById('planetWrap');
      const W = wrap.clientWidth || 900;
      const H = wrap.clientHeight || 640;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 1000);
      camera.position.set(0, 0.2, 4.4);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setSize(W, H);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      container.appendChild(renderer.domElement);

      // ---- starfield
      (function buildStars() {
        const g = new THREE.BufferGeometry();
        const N = 4500;
        const arr = new Float32Array(N * 3);
        const col = new Float32Array(N * 3);
        const palette = [[1, 1, 1], [0.85, 0.9, 1], [1, 0.9, 0.8], [0.8, 0.95, 1], [1, 0.85, 0.95]];
        for (let i = 0; i < N; i++) {
          const r = 40 + Math.random() * 90;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          arr[i * 3] = r * Math.sin(phi) * Math.cos(theta);
          arr[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
          arr[i * 3 + 2] = r * Math.cos(phi);
          const c = palette[Math.floor(Math.random() * palette.length)];
          const bright = 0.6 + Math.random() * 0.4;
          col[i * 3] = c[0] * bright; col[i * 3 + 1] = c[1] * bright; col[i * 3 + 2] = c[2] * bright;
        }
        g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
        g.setAttribute('color', new THREE.BufferAttribute(col, 3));
        const m = new THREE.PointsMaterial({
          size: 0.28, sizeAttenuation: true, vertexColors: true,
          transparent: true, opacity: 0.95, depthWrite: false
        });
        scene.add(new THREE.Points(g, m));
      })();

      // ---- planet surface texture
      function buildPlanetTexture() {
        const c = document.createElement('canvas');
        c.width = 2048; c.height = 1024;
        const ctx = c.getContext('2d');

        const baseGrad = ctx.createLinearGradient(0, 0, 0, 1024);
        baseGrad.addColorStop(0.00, '#4a2418');
        baseGrad.addColorStop(0.18, '#7a3a24');
        baseGrad.addColorStop(0.42, '#a85c3a');
        baseGrad.addColorStop(0.58, '#9c5436');
        baseGrad.addColorStop(0.82, '#6e3320');
        baseGrad.addColorStop(1.00, '#3d1d12');
        ctx.fillStyle = baseGrad;
        ctx.fillRect(0, 0, 2048, 1024);

        for (let i = 0; i < 6000; i++) {
          const x = Math.random() * 2048, y = Math.random() * 1024;
          const s = 2 + Math.random() * 6;
          const v = Math.random();
          ctx.fillStyle = v > 0.5
            ? 'rgba(255, 200, 160, ' + (0.02 + Math.random() * 0.05).toFixed(3) + ')'
            : 'rgba(40, 15, 8, ' + (0.02 + Math.random() * 0.06).toFixed(3) + ')';
          ctx.fillRect(x, y, s, s);
        }

        for (let i = 0; i < 90; i++) {
          const x = Math.random() * 2048, y = 200 + Math.random() * 624;
          const r = 30 + Math.random() * 140;
          const g = ctx.createRadialGradient(x, y, 0, x, y, r);
          const dark = Math.random() > 0.5;
          g.addColorStop(0, dark ? 'rgba(60, 26, 15, 0.55)' : 'rgba(180, 105, 65, 0.42)');
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        }

        for (let i = 0; i < 22; i++) {
          const x = Math.random() * 2048, y = 260 + Math.random() * 500;
          const r = 40 + Math.random() * 130;
          const g = ctx.createRadialGradient(x, y, 0, x, y, r);
          g.addColorStop(0, 'rgba(30, 55, 85, 0.45)');
          g.addColorStop(0.7, 'rgba(30, 55, 85, 0.15)');
          g.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        }

        const cap1 = ctx.createLinearGradient(0, 0, 0, 100);
        cap1.addColorStop(0, 'rgba(235, 240, 250, 0.92)');
        cap1.addColorStop(0.6, 'rgba(235, 240, 250, 0.35)');
        cap1.addColorStop(1, 'rgba(235, 240, 250, 0)');
        ctx.fillStyle = cap1; ctx.fillRect(0, 0, 2048, 100);

        const cap2 = ctx.createLinearGradient(0, 1024, 0, 924);
        cap2.addColorStop(0, 'rgba(235, 240, 250, 0.92)');
        cap2.addColorStop(0.6, 'rgba(235, 240, 250, 0.35)');
        cap2.addColorStop(1, 'rgba(235, 240, 250, 0)');
        ctx.fillStyle = cap2; ctx.fillRect(0, 924, 2048, 100);

        for (let i = 0; i < 340; i++) {
          const x = Math.random() * 2048;
          const y = 100 + Math.random() * 824;
          const r = 0.8 + Math.random() * 4.5;
          ctx.fillStyle = 'rgba(30, 12, 8, ' + (0.25 + Math.random() * 0.3).toFixed(2) + ')';
          ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = 'rgba(230, 170, 130, ' + (0.15 + Math.random() * 0.25).toFixed(2) + ')';
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.arc(x, y, r + 0.6, Math.PI * 0.15, Math.PI * 0.95);
          ctx.stroke();
        }

        for (let i = 0; i < 60; i++) {
          const x = Math.random() * 2048;
          const y = 180 + Math.random() * 640;
          const w = 20 + Math.random() * 90;
          const h = 4 + Math.random() * 12;
          const g = ctx.createLinearGradient(x, y - h, x, y + h);
          g.addColorStop(0, 'rgba(220, 150, 100, 0.35)');
          g.addColorStop(0.5, 'rgba(120, 60, 35, 0.4)');
          g.addColorStop(1, 'rgba(40, 15, 8, 0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + w / 2, y - h);
          ctx.lineTo(x + w, y);
          ctx.closePath();
          ctx.fill();
        }

        const tex = new THREE.CanvasTexture(c);
        tex.anisotropy = 8;
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.ClampToEdgeWrapping;
        return tex;
      }

      function buildBumpTexture() {
        const c = document.createElement('canvas');
        c.width = 1024; c.height = 512;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, 1024, 512);
        for (let i = 0; i < 5000; i++) {
          const x = Math.random() * 1024, y = Math.random() * 512;
          const r = 1 + Math.random() * 5;
          const v = Math.floor(Math.random() * 80) - 40;
          const shade = clamp(128 + v, 0, 255);
          ctx.fillStyle = 'rgba(' + shade + ',' + shade + ',' + shade + ',0.5)';
          ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        }
        const t = new THREE.CanvasTexture(c);
        t.wrapS = THREE.RepeatWrapping;
        t.wrapT = THREE.RepeatWrapping;
        return t;
      }

      const planetTex = buildPlanetTexture();
      const bumpTex = buildBumpTexture();

      const planetGroup = new THREE.Group();
      planetGroup.rotation.z = 0.22;
      scene.add(planetGroup);

      const planetGeo = new THREE.SphereGeometry(1, 128, 96);
      const planetMat = new THREE.MeshPhongMaterial({
        map: planetTex, bumpMap: bumpTex, bumpScale: 0.035,
        shininess: 8, specular: new THREE.Color(0x111111)
      });
      const planet = new THREE.Mesh(planetGeo, planetMat);
      planetGroup.add(planet);

      // clouds
      function buildCloudTexture() {
        const c = document.createElement('canvas');
        c.width = 2048; c.height = 1024;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, 2048, 1024);
        for (let band = 0; band < 14; band++) {
          const y0 = (band / 14) * 1024 + 20 + Math.random() * 40;
          const amp = 20 + Math.random() * 60;
          ctx.beginPath();
          for (let x = 0; x <= 2048; x += 8) {
            const yy = y0 + Math.sin((x / 2048) * Math.PI * (2 + band) + band) * amp * 0.4;
            if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
          }
          ctx.strokeStyle = 'rgba(255, 235, 215, ' + (0.06 + Math.random() * 0.12).toFixed(3) + ')';
          ctx.lineWidth = 30 + Math.random() * 90;
          ctx.lineCap = 'round';
          ctx.stroke();
        }
        for (let i = 0; i < 420; i++) {
          const x = Math.random() * 2048;
          const y = 80 + Math.random() * 864;
          const r = 8 + Math.random() * 55;
          const g = ctx.createRadialGradient(x, y, 0, x, y, r);
          g.addColorStop(0, 'rgba(255, 240, 225, ' + (0.12 + Math.random() * 0.22).toFixed(3) + ')');
          g.addColorStop(1, 'rgba(255, 240, 225, 0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        }
        const t = new THREE.CanvasTexture(c);
        t.wrapS = THREE.RepeatWrapping;
        t.wrapT = THREE.ClampToEdgeWrapping;
        return t;
      }
      const cloudTex = buildCloudTexture();
      const clouds = new THREE.Mesh(
        new THREE.SphereGeometry(1.018, 96, 64),
        new THREE.MeshPhongMaterial({ map: cloudTex, transparent: true, opacity: 0.55, depthWrite: false })
      );
      planetGroup.add(clouds);

      // atmosphere
      const atmosphere = new THREE.Mesh(
        new THREE.SphereGeometry(1.16, 96, 64),
        new THREE.ShaderMaterial({
          vertexShader: 'varying vec3 vNormal; varying vec3 vWorldPos; void main(){ vNormal = normalize(normalMatrix * normal); vec4 wp = modelMatrix * vec4(position, 1.0); vWorldPos = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }',
          fragmentShader: 'varying vec3 vNormal; varying vec3 vWorldPos; void main(){ vec3 viewDir = normalize(cameraPosition - vWorldPos); float rim = 1.0 - max(dot(viewDir, vNormal), 0.0); float intensity = pow(rim, 2.4); vec3 col = mix(vec3(0.30, 0.70, 1.0), vec3(0.55, 0.85, 1.0), rim); gl_FragColor = vec4(col, intensity * 0.95); }',
          blending: THREE.AdditiveBlending, side: THREE.BackSide, transparent: true, depthWrite: false
        })
      );
      planetGroup.add(atmosphere);

      // halo
      (function() {
        const c = document.createElement('canvas'); c.width = 256; c.height = 256;
        const ctx = c.getContext('2d');
        const g = ctx.createRadialGradient(128, 128, 40, 128, 128, 128);
        g.addColorStop(0, 'rgba(90, 170, 255, 0.42)');
        g.addColorStop(0.5, 'rgba(60, 130, 220, 0.12)');
        g.addColorStop(1, 'rgba(30, 80, 180, 0)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
        sprite.scale.set(3.4, 3.4, 1);
        sprite.position.set(0, 0, -0.2);
        scene.add(sprite);
      })();

      // lights
      const sun = new THREE.DirectionalLight(0xfff3dc, 2.4);
      sun.position.set(5, 2.5, 4);
      scene.add(sun);
      const fill = new THREE.DirectionalLight(0x4466cc, 0.45);
      fill.position.set(-5, -2, -3);
      scene.add(fill);
      const ambient = new THREE.AmbientLight(0x223355, 1.1);
      scene.add(ambient);

      // sun glare
      (function() {
        const c = document.createElement('canvas'); c.width = 512; c.height = 512;
        const ctx = c.getContext('2d');
        const g = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
        g.addColorStop(0, 'rgba(255, 245, 220, 1)');
        g.addColorStop(0.1, 'rgba(255, 220, 170, 0.7)');
        g.addColorStop(0.35, 'rgba(255, 180, 100, 0.2)');
        g.addColorStop(1, 'rgba(255, 140, 60, 0)');
        ctx.fillStyle = g; ctx.fillRect(0, 0, 512, 512);
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < 8; i++) {
          const ang = (i / 8) * Math.PI * 2;
          const g2 = ctx.createLinearGradient(256 + Math.cos(ang) * 20, 256 + Math.sin(ang) * 20, 256 + Math.cos(ang) * 256, 256 + Math.sin(ang) * 256);
          g2.addColorStop(0, 'rgba(255, 230, 190, 0.35)');
          g2.addColorStop(1, 'rgba(255, 180, 100, 0)');
          ctx.strokeStyle = g2; ctx.lineWidth = 14;
          ctx.beginPath();
          ctx.moveTo(256 + Math.cos(ang) * 20, 256 + Math.sin(ang) * 20);
          ctx.lineTo(256 + Math.cos(ang) * 256, 256 + Math.sin(ang) * 256);
          ctx.stroke();
        }
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false }));
        sprite.scale.set(3.2, 3.2, 1);
        sprite.position.set(6, 3, 2);
        scene.add(sprite);
        planet3D.sunSprite = sprite;
      })();

      // moons
      const moons = [];
      function makeMoon(radius, color, orbit, speed, tilt, phase) {
        const geo = new THREE.SphereGeometry(radius, 32, 24);
        const mat = new THREE.MeshPhongMaterial({ color, shininess: 3 });
        const mesh = new THREE.Mesh(geo, mat);
        const moonCanvas = document.createElement('canvas');
        moonCanvas.width = 256; moonCanvas.height = 128;
        const mctx = moonCanvas.getContext('2d');
        mctx.fillStyle = '#' + color.toString(16).padStart(6, '0');
        mctx.fillRect(0, 0, 256, 128);
        for (let i = 0; i < 200; i++) {
          const x = Math.random() * 256, y = Math.random() * 128, r = 1 + Math.random() * 4;
          mctx.fillStyle = 'rgba(0,0,0,' + (0.15 + Math.random() * 0.25).toFixed(2) + ')';
          mctx.beginPath(); mctx.arc(x, y, r, 0, Math.PI * 2); mctx.fill();
          mctx.strokeStyle = 'rgba(255,255,255,0.15)';
          mctx.beginPath(); mctx.arc(x, y, r + 0.5, 0, Math.PI * 2); mctx.stroke();
        }
        mat.map = new THREE.CanvasTexture(moonCanvas);
        scene.add(mesh);
        moons.push({ mesh, orbit, speed, tilt, phase });
      }
      makeMoon(0.17, 0x9aa0a8, 2.7, 0.006, 0.15, 0);
      makeMoon(0.09, 0xb08878, 3.6, 0.010, -0.2, Math.PI);
      makeMoon(0.06, 0x7a8ea0, 4.3, 0.014, 0.05, Math.PI * 0.7);

      // city sprites
      const citySprites = [];
      const cityPositions = [
        { lat: 12, lon: 24, size: 0.14, color: 0x35e6ff },
        { lat: 28, lon: 82, size: 0.10, color: 0xffb020 },
        { lat: -6, lon: -70, size: 0.10, color: 0xff2e8b },
        { lat: -40, lon: 30, size: 0.09, color: 0x29e08a },
        { lat: 50, lon: -110, size: 0.08, color: 0x35e6ff }
      ];
      function glowSprite(color) {
        const c = document.createElement('canvas'); c.width = 64; c.height = 64;
        const ctx = c.getContext('2d');
        const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        const hex = '#' + color.toString(16).padStart(6, '0');
        g.addColorStop(0, hex);
        g.addColorStop(0.4, hex + '80');
        g.addColorStop(1, hex + '00');
        ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(c);
      }
      cityPositions.forEach(cp => {
        const phi = (90 - cp.lat) * Math.PI / 180;
        const theta = (cp.lon + 180) * Math.PI / 180;
        const x = -Math.sin(phi) * Math.cos(theta);
        const y = Math.cos(phi);
        const z = Math.sin(phi) * Math.sin(theta);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
          map: glowSprite(cp.color), blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
        }));
        sprite.position.set(x * 1.01, y * 1.01, z * 1.01);
        sprite.scale.set(cp.size, cp.size, 1);
        planet.add(sprite);
        citySprites.push(sprite);
      });

      // labels
      const labelDefs = [
        { text: 'Dôme Central', lat: 12, lon: 24, kind: 'city', color: '#35e6ff' },
        { text: 'Secteur Est', lat: 28, lon: 82, kind: 'city', color: '#ffb020' },
        { text: 'Secteur Ouest', lat: -6, lon: -70, kind: 'city', color: '#ff2e8b' },
        { text: 'Secteur Austral', lat: -42, lon: 30, kind: 'city', color: '#29e08a' },
        { text: 'Continent Alpha', lat: 5, lon: -18, kind: 'geo' },
        { text: 'Continent Beta', lat: 38, lon: 145, kind: 'geo' },
        { text: 'Chaîne Boréale', lat: 52, lon: -110, kind: 'geo' },
        { text: 'Mer Australe', lat: -38, lon: -60, kind: 'geo' },
        { text: 'Pôle Nord', lat: 84, lon: 0, kind: 'geo' },
        { text: 'Pôle Sud', lat: -84, lon: 0, kind: 'geo' }
      ];
      const labelEls = [];
      if (labelsRoot) {
        labelsRoot.innerHTML = '';
        labelDefs.forEach(def => {
          const el = document.createElement('div');
          el.className = 'planet-label ' + (def.kind === 'city' ? 'city-label' : 'geo-label');
          if (def.color) el.style.setProperty('--lc', def.color);
          el.innerHTML = '<span class="pl-dot"></span><span class="pl-txt">' + esc(def.text) + '</span>';
          labelsRoot.appendChild(el);

          const phi = (90 - def.lat) * Math.PI / 180;
          const theta = (def.lon + 180) * Math.PI / 180;
          const localPos = new THREE.Vector3(
            -Math.sin(phi) * Math.cos(theta),
            Math.cos(phi),
            Math.sin(phi) * Math.sin(theta)
          ).multiplyScalar(1.02);
          labelEls.push({ el, localPos, kind: def.kind });
        });
      }

      // interaction
      let isDragging = false, prevX = 0, prevY = 0;
      let targetRotY = 0, targetRotX = 0;
      let currentRotY = 0, currentRotX = 0;
      const AUTO_SPEED = 0.0016;

      const dom = renderer.domElement;
      dom.style.cursor = 'grab';
      function onDown(e) { isDragging = true; prevX = e.clientX; prevY = e.clientY; dom.style.cursor = 'grabbing'; }
      function onMove(e) {
        if (!isDragging) return;
        targetRotY += (e.clientX - prevX) * 0.008;
        targetRotX = clamp(targetRotX + (e.clientY - prevY) * 0.006, -0.5, 0.5);
        prevX = e.clientX; prevY = e.clientY;
      }
      function onUp() { isDragging = false; if (dom) dom.style.cursor = 'grab'; }
      dom.addEventListener('mousedown', onDown);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
      dom.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) { isDragging = true; prevX = e.touches[0].clientX; prevY = e.touches[0].clientY; }
      }, { passive: true });
      dom.addEventListener('touchmove', (e) => {
        if (!isDragging || e.touches.length !== 1) return;
        targetRotY += (e.touches[0].clientX - prevX) * 0.008;
        targetRotX = clamp(targetRotX + (e.touches[0].clientY - prevY) * 0.006, -0.5, 0.5);
        prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
      }, { passive: true });
      dom.addEventListener('touchend', () => { isDragging = false; });

      // animation
      let running = true;
      const clock = new THREE.Clock();

      function animate() {
        if (!running) return;
        requestAnimationFrame(animate);
        const dt = clock.getDelta();
        const t = clock.getElapsedTime();

        if (!isDragging) targetRotY += AUTO_SPEED * (dt * 60);

        currentRotY += (targetRotY - currentRotY) * 0.08;
        currentRotX += (targetRotX - currentRotX) * 0.08;

        planet.rotation.y = currentRotY;
        clouds.rotation.y = currentRotY * 1.06;
        atmosphere.rotation.y = currentRotY;
        planet.rotation.x = currentRotX * 0.5;

        moons.forEach((m, i) => {
          m.phase += m.speed * dt * 60;
          m.mesh.position.set(
            Math.cos(m.phase) * m.orbit,
            Math.sin(m.phase * 0.6 + i) * m.orbit * m.tilt,
            Math.sin(m.phase) * m.orbit
          );
          m.mesh.rotation.y += 0.004;
        });

        if (planet3D.sunSprite) {
          planet3D.sunSprite.position.x = 6 + Math.sin(t * 0.05) * 0.2;
          planet3D.sunSprite.position.y = 3 + Math.cos(t * 0.04) * 0.15;
        }

        if (labelEls.length && labelsRoot) {
          planet.updateMatrixWorld();
          labelEls.forEach(item => {
            const worldPos = item.localPos.clone().applyMatrix4(planet.matrixWorld);
            const projected = worldPos.clone().project(camera);
            const x = (projected.x * 0.5 + 0.5) * W;
            const y = (-projected.y * 0.5 + 0.5) * H;
            const worldDir = worldPos.clone().normalize();
            const toCam = camera.position.clone().sub(worldPos).normalize();
            const visible = worldDir.dot(toCam) > 0.06 && projected.z < 1;
            item.el.style.left = x.toFixed(1) + 'px';
            item.el.style.top = y.toFixed(1) + 'px';
            item.el.style.opacity = visible ? '1' : '0';
          });
        }

        renderer.render(scene, camera);
      }
      animate();

      if (loading) {
        loading.style.transition = 'opacity .5s';
        loading.style.opacity = '0';
        setTimeout(() => { if (loading.parentNode) loading.parentNode.removeChild(loading); }, 520);
      }

      planet3D.scene = scene;
      planet3D.camera = camera;
      planet3D.renderer = renderer;
      planet3D.stop = () => { running = false; };
      planet3D.dispose = () => {
        running = false;
        dom.removeEventListener('mousedown', onDown);
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
        try { renderer.dispose(); } catch (e) {}
        if (renderer.domElement && renderer.domElement.parentNode) {
          renderer.domElement.parentNode.removeChild(renderer.domElement);
        }
        scene.traverse(o => {
          if (o.geometry) o.geometry.dispose();
          if (o.material) {
            if (Array.isArray(o.material)) o.material.forEach(m => m.dispose && m.dispose());
            else if (o.material.dispose) o.material.dispose();
          }
        });
      };

      const onResize = () => {
        if (!running || !container.clientWidth) return;
        const nw = container.clientWidth;
        const nh = container.clientHeight || 640;
        camera.aspect = nw / nh;
        camera.updateProjectionMatrix();
        renderer.setSize(nw, nh);
      };
      window.addEventListener('resize', onResize);
    }

        '<circle cx="65" cy="65" r="54" fill="none" stroke="rgba(80,140,200,.15)" stroke-width="11"/>' +
        '<circle cx="65" cy="65" r="54" fill="none" stroke="url(#ringgrad)" stroke-width="11" stroke-linecap="round" ' +
        'stroke-dasharray="' + (circ * ringPct / 100) + ' ' + circ + '" transform="rotate(-90 65 65)"/>' +
        '<defs><linearGradient id="ringgrad" x1="0" y1="0" x2="1" y2="1">' +

        '</div>';
    }

    function donutChart(segments, size, thickness) {
      const r = (size - thickness) / 2;
      const c = 2 * Math.PI * r;
      const total = segments.reduce((a, b) => a + b.value, 0) || 1;
      let offset = 0, out = '';
      segments.forEach(s => {
        const len = (s.value / total) * c;
        if (len <= 0) return;
        out += '<circle cx="' + (size / 2) + '" cy="' + (size / 2) + '" r="' + r + '" fill="none" stroke="' + s.color + '" ' +
          'stroke-width="' + thickness + '" stroke-dasharray="' + len + ' ' + (c - len) + '" ' +
          'stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 ' + (size / 2) + ' ' + (size / 2) + ')"/>';
        offset += len;
      });
      return '<svg class="donut" viewBox="0 0 ' + size + ' ' + size + '">' + out + '</svg>';
    }
